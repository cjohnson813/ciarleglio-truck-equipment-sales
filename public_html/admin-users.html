<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a60a7">
    <title>Manage Users - Ciarleglio Truck-Equip</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/auth.js" defer></script>
    <script src="js/admin-users.js" defer></script>
</head>
<body class="account-page">
    <div class="auth-bar-wrap">
        <a href="index.html" class="auth-bar-home">Home</a>
        <a href="listings.html" class="auth-bar-home">Inventory</a>
        <a href="account.html" class="auth-bar-home">Account</a>
        <a href="admin.html" class="auth-bar-home">Admin Inventory</a>
        <a href="#" id="auth-link" class="auth-button">Login/Sign Up</a>
    </div>
    <div id="auth-modal" class="auth-modal" aria-hidden="true">
        <div class="auth-modal-backdrop"></div>
        <div class="auth-modal-box">
            <button type="button" class="auth-modal-close" id="auth-modal-close" aria-label="Close">&times;</button>
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" data-tab="login">Login</button>
                <button type="button" class="auth-tab" data-tab="signup">Sign Up</button>
            </div>
            <form id="auth-login-form" class="auth-form">
                <label>Username or email <input type="text" name="login" required autocomplete="username"></label>
                <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
                <p class="auth-form-extra"><a href="#" id="auth-forgot-link">Forgot password?</a></p>
                <button type="submit" class="auth-submit">Log in</button>
                <p id="auth-login-error" class="auth-error" role="alert"></p>
            </form>
            <form id="auth-signup-form" class="auth-form" style="display: none;">
                <label>Username (min 8 characters) <input type="text" name="username" required minlength="8" autocomplete="username"></label>
                <label>Email <input type="email" name="email" required autocomplete="email"></label>
                <label>Phone <input type="tel" name="phone" required placeholder="e.g. 8608767740" autocomplete="tel"></label>
                <label>Password (min 8 characters) <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
                <button type="submit" class="auth-submit">Create account</button>
                <p id="auth-signup-error" class="auth-error" role="alert"></p>
            </form>
            <div id="auth-forgot-form" class="auth-form" style="display: none;">
                <label>Email <input type="email" id="auth-forgot-email" placeholder="Enter your email" autocomplete="email"></label>
                <button type="button" id="auth-forgot-submit" class="auth-submit">Send reset link</button>
                <p><a href="#" id="auth-forgot-back">Back to login</a></p>
                <p id="auth-forgot-message" class="auth-error" role="alert"></p>
            </div>
        </div>
    </div>
    <div id="verify-email-banner" class="verify-email-banner" style="display: none;">
        Please verify your email to access your account. <button type="button" id="verify-resend-btn">Resend verification email</button>
    </div>

    <div class="admin-users-wrap">
        <h2>User management</h2>
        <p id="admin-users-message" class="admin-users-message"></p>
        <div class="admin-users-table-wrap">
        <table class="admin-users-table">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Verified</th>
                    <th>Role</th>
                </tr>
            </thead>
            <tbody id="admin-users-tbody">
            </tbody>
        </table>
        </div>
    </div>
</body>
</html>
