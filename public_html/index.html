<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciarleglio Truck and Equipment Sales</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script src="js/auth.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body class="landing-page">
    <!-- Top Gap -->
    <div class="top-gap"></div>

    <!-- White Header with Social Icons, Contact Info, and Auth -->
    <header class="top-header">
        <div class="social-icons">
            <a href="#" class="social-icon" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="#" class="social-icon" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
        <div class="header-top-right">
            <div class="contact-info">
                <div class="contact-line">
                    <i class="fas fa-envelope"></i>
                    <span>joey@ciarlegliotruckandequipmentsales.com</span>
                </div>
                <div class="contact-line">
                    <i class="fas fa-phone"></i>
                    <span>(860) 876-7740</span>
                </div>
            </div>
            <a href="#" id="auth-link" class="auth-button">Login/Sign Up</a>
        </div>
    </header>

    <!-- Login / Sign Up Modal -->
    <div id="auth-modal" class="auth-modal" aria-hidden="true">
        <div class="auth-modal-backdrop"></div>
        <div class="auth-modal-box">
            <button type="button" class="auth-modal-close" id="auth-modal-close" aria-label="Close">&times;</button>
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" data-tab="login">Login</button>
                <button type="button" class="auth-tab" data-tab="signup">Sign Up</button>
            </div>
            <form id="auth-login-form" class="auth-form">
                <label>Username or email <input type="text" name="login" required autocomplete="username"></label>
                <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
                <button type="submit" class="auth-submit">Log in</button>
                <p id="auth-login-error" class="auth-error" role="alert"></p>
            </form>
            <form id="auth-signup-form" class="auth-form" style="display: none;">
                <label>Username (min 8 characters) <input type="text" name="username" required minlength="8" autocomplete="username"></label>
                <label>Email <input type="email" name="email" required autocomplete="email"></label>
                <label>Phone <input type="tel" name="phone" required placeholder="e.g. 8608767740" autocomplete="tel"></label>
                <label>Password (min 8 characters) <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
                <button type="submit" class="auth-submit">Create account</button>
                <p id="auth-signup-error" class="auth-error" role="alert"></p>
            </form>
        </div>
    </div>

    <!-- Gap between headers -->
    <div class="header-gap"></div>

    <!-- Large Gray Header with Diagonal Split -->
    <header class="main-header">
        <div class="header-left">
            <img src="images/company-logo.png" alt="Company Logo" class="company-logo" />
        </div>
        <div class="header-divider"></div>
        <div class="header-right">
            <button class="nav-button">Home</button>
            <button class="nav-button">All Inventory</button>
            <button class="nav-button">Financing</button>
            <button class="nav-button">Contact Us</button>
        </div>
    </header>

    <!-- Gap before search -->
    <div class="header-gap"></div>

    <!-- Search Bar -->
    <div class="search-container">
        <input type="search" placeholder="Search..." class="search-input" />
    </div>

    <!-- Gap before category buttons -->
    <div class="category-gap"></div>

    <!-- Category Buttons -->
    <div class="category-buttons-container">
        <button class="category-large-button" data-category="Trucks">
            <img src="images/category-trucks.png" alt="Trucks" class="category-bg-image" />
            <span class="category-text">Trucks</span>
        </button>
        <button class="category-large-button" data-category="Equipment">
            <img src="images/category-equipment.png" alt="Equipment" class="category-bg-image" />
            <span class="category-text">Equipment</span>
        </button>
        <button class="category-large-button" data-category="Attachments">
            <img src="images/category-attachments.png" alt="Attachments" class="category-bg-image" />
            <span class="category-text">Attachments</span>
        </button>
        <button class="category-large-button" data-category="Other">
            <img src="images/category-other.png" alt="Other" class="category-bg-image" />
            <span class="category-text">Other</span>
        </button>
    </div>

    <!-- Carousel Section -->
    <div class="carousel-section">
        <h2 class="carousel-title">Recent Inventory</h2>
        <div class="carousel-container">
            <button class="carousel-arrow carousel-arrow-left" aria-label="Previous items">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="carousel-track">
                <div class="carousel-items" id="carousel-items">
                    <!-- Items will be populated by JavaScript -->
                </div>
            </div>
            <button class="carousel-arrow carousel-arrow-right" aria-label="Next items">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>
</body>
</html>
