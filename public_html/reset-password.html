<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a60a7">
    <title>Reset Password - Ciarleglio Truck-Equip</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/config.js"></script>
</head>
<body class="account-page">
    <div class="account-wrap">
        <a href="index.html" class="account-back">&larr; Back to Home</a>
        <div class="account-cell">
            <h2>Set new password</h2>
            <p id="reset-message" class="account-message"></p>
            <form id="reset-form">
                <div class="account-field">
                    <label>New password (min 8 characters)</label>
                    <input type="password" id="new-password" minlength="8" required autocomplete="new-password" />
                </div>
                <div class="account-field">
                    <label>Confirm new password</label>
                    <input type="password" id="confirm-password" minlength="8" required autocomplete="new-password" />
                </div>
                <button type="submit" class="auth-submit">Reset password</button>
            </form>
            <p><a href="index.html" id="reset-login-link" style="display:none;">Log in</a></p>
        </div>
    </div>
    <script>
(function () {
  var apiBase = (window.API_BASE || '').trim() || 'http://localhost:4000';
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var form = document.getElementById('reset-form');
  var message = document.getElementById('reset-message');
  var loginLink = document.getElementById('reset-login-link');
  if (!token) {
    message.textContent = 'Missing reset token. Request a new link from the login page.';
    message.className = 'account-message error';
    form.style.display = 'none';
    return;
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var newPw = document.getElementById('new-password').value;
    var confirmPw = document.getElementById('confirm-password').value;
    if (newPw !== confirmPw) {
      message.textContent = 'Passwords do not match.';
      message.className = 'account-message error';
      return;
    }
    message.textContent = '';
    fetch(apiBase + '/api/auth/reset-password', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, newPassword: newPw })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (r.ok) {
          message.textContent = (r.data && r.data.message) ? r.data.message : 'Password updated. You can log in now.';
          message.className = 'account-message success';
          form.style.display = 'none';
          loginLink.style.display = 'inline';
        } else {
          message.textContent = (r.data && r.data.error) ? r.data.error : 'Reset failed.';
          message.className = 'account-message error';
        }
      })
      .catch(function () {
        message.textContent = 'Network error.';
        message.className = 'account-message error';
      });
  });
})();
    </script>
</body>
</html>
