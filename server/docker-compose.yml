# Local PostgreSQL for development (run from /server: docker compose up -d)
services:
  postgres:
    image: postgres:16-alpine
    container_name: cte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cte
      POSTGRES_PASSWORD: cte_local_dev
      POSTGRES_DB: ciarleglio
    ports:
      - "5432:5432"
    volumes:
      - cte_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cte -d ciarleglio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cte_pgdata:
